<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <mat-form-field class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" />
          <mat-error *ngIf="form.controls.nome.invalid">Nome é obrigatório.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>CRP</mat-label>
          <input matInput formControlName="crp" maxlength="7" />
          <mat-error *ngIf="form.controls.crp.invalid">Informe de 4 a 7 dígitos.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Especialidade</mat-label>
          <mat-select formControlName="especialidade">
            <mat-option *ngFor="let specialty of specialties" [value]="specialty">{{ specialty }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.especialidade.invalid">Especialidade é obrigatória.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" />
          <mat-error *ngIf="form.controls.telefone.invalid">Telefone inválido.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="form.controls.email.invalid">E-mail inválido.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>CEP</mat-label>
          <input matInput formControlName="cep" maxlength="9" />
          <mat-hint *ngIf="buscandoCep">Buscando endereço...</mat-hint>
          <mat-error *ngIf="form.controls.cep.hasError('cepNaoEncontrado')">CEP não encontrado.</mat-error>
          <mat-error *ngIf="form.controls.cep.hasError('pattern')">CEP inválido.</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Logradouro</mat-label>
          <input matInput formControlName="logradouro" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Número</mat-label>
          <input matInput formControlName="numero" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Complemento</mat-label>
          <input matInput formControlName="complemento" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Bairro</mat-label>
          <input matInput formControlName="bairro" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Cidade</mat-label>
          <input matInput formControlName="cidade" />
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>UF</mat-label>
          <input matInput formControlName="uf" maxlength="2" />
        </mat-form-field>
      </div>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="salvando">
          {{ salvando ? 'Salvando...' : (editId ? 'Atualizar' : 'Salvar') }}
        </button>
        <button mat-button type="button" (click)="onCancel()">Cancelar</button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
