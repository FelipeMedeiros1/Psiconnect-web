<div class="patient-filters">
  <mat-form-field appearance="outline">
    <mat-label>Situação</mat-label>
    <mat-select [formControl]="statusControl">
      <mat-option value="ativos">Ativos</mat-option>
      <mat-option value="inativos">Inativos</mat-option>
      <mat-option value="todos">Todos</mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div *ngIf="patiens$ | async as patient; else loading">
  <div class="table-wrapper">
  <mat-table [dataSource]="patient" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>Prontuário</mat-header-cell>
      <mat-cell *matCellDef="let patient">{{ patient.id }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let patient">
        {{ patient.status ? "Ativo" : "Inativo" }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="nome">
      <mat-header-cell *matHeaderCellDef>Nome</mat-header-cell>
      <mat-cell *matCellDef="let patient">{{ patient.nome }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let patient">{{ patient.email }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="telefone">
      <mat-header-cell *matHeaderCellDef>Telefone</mat-header-cell>
      <mat-cell *matCellDef="let patient">{{ formatPhone(patient) }}</mat-cell>
    </ng-container>


    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>
        <button (click)="onAdd()" mat-icon-button aria-label="Inserir Paciente" matTooltip="Cadastrar novo paciente">
          <mat-icon>add</mat-icon>
        </button>
      </mat-header-cell>

      <mat-cell *matCellDef="let patient">
        <button mat-icon-button color="primary" aria-label="Ver informações do paciente"
                matTooltip="Ver informações do paciente" (click)="onView(patient)">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button aria-label="Editar Paciente" (click)="onEdit(patient)"
                [disabled]="!patient.status"
                [matTooltip]="patient.status ? 'Editar paciente' : 'Reative o paciente para editar'">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="primary" aria-label="Dar alta ao paciente"
                matTooltip="Dar alta ao paciente" (click)="onDischarge(patient)" *ngIf="patient.status">
          <mat-icon>assignment_turned_in</mat-icon>
        </button>

        <button mat-icon-button color="primary" aria-label="Reativar paciente"
                matTooltip="Reativar paciente" (click)="onReactivate(patient)" *ngIf="!patient.status">
          <mat-icon>restore</mat-icon>
        </button>
        <button mat-icon-button aria-label="Inativar Paciente" (click)="onDeactivate(patient)" [disabled]="!patient.status">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
  </div>
</div>
<ng-template #loading>
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
